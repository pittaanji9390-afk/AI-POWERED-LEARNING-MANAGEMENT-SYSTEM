apiVersion: apps/v1
kind: Deployment
metadata:
  name: ailms-backend
  labels:
    app: ailms-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ailms-backend
  template:
    metadata:
      labels:
        app: ailms-backend
    spec:
      containers:
      - name: backend
        image: ailms-backend:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 15
